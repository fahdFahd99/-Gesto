# Standalone project dependency policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
# Audited, pinned security patch releases; application behavior stays on Next 16.3.
overrides:
  ws: 8.21.0
  '@babel/core': 7.29.6
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  fast-uri: 3.1.8
  source-map-js: 1.2.2
  sharp: 0.35.5
